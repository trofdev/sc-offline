name: build

# Verification only: this fork publishes no releases and uploads no artifacts.
# Build it yourself; see README.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds on Linux: parse errors and MSVC C2712 risks fail here, before the Windows build.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang + mingw-w64 headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang g++-mingw-w64-x86-64-posix

      - name: tools/check.sh
        run: tools/check.sh

  build:
    needs: check
    # Pinned: the project builds with the v145 toolset, which this image carries (VS 2026).
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Build (Release x64)
        run: msbuild sc-offline.slnx /p:Configuration=Release /p:Platform=x64 /m
